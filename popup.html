<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 280px; font-family: system-ui, -apple-system, sans-serif; padding: 14px; text-align: center; box-sizing: border-box; }
    h4 { margin: 0 0 10px 0; color: #333; }
    input { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; font-size: 12px; margin-bottom: 8px; }
    button { background: #007bff; color: white; border: none; padding: 9px; border-radius: 4px; cursor: pointer; width: 100%; font-weight: bold; font-size: 13px; }
    button:hover { background: #0056b3; }
    .divider { margin: 12px 0; border-bottom: 1px solid #eee; }
    #status { margin-top: 10px; font-size: 12px; color: #333; word-break: break-word; }
    p { font-size: 11px; color: #666; margin: 4px 0; line-height: 1.4; text-align: left; }
  </style>
</head>
<body>
  <h4>Krpano HTML Downloader</h4>
  
  <input type="text" id="urlInput" placeholder="এখানে যেকোনো লিংক পেস্ট করুন...">
  <button id="downloadInputBtn">ডাউনলোড করুন (Pasted Link)</button>

  <div class="divider"></div>

  <button id="downloadBtn" style="background: #28a745;">Current Tab ডাউনলোড করুন</button>

  <p style="margin-top: 10px;">💡 <b>টিপস:</b> যেকোনো গুগল সার্চ লিংকের ওপর <b>Right-Click</b> করে <i>"Download Krpano Target HTML"</i> সিলেক্ট করুন।</p>
  
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
